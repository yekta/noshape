name: Set up OCCT
description: >
  Restores a cached static, headless OpenCascade install (or builds it with
  scripts/build-occt.sh / scripts/build-occt.ps1 and saves it to the cache
  right away), then exports OCCT_ROOT. On Windows the MSVC developer
  environment must already be active (ilammy/msvc-dev-cmd).
inputs:
  occt-tag:
    description: OCCT git tag to build
    default: V8_0_1
outputs:
  occt-root:
    description: OCCT install prefix
    value: ${{ steps.paths.outputs.prefix }}
runs:
  using: composite
  steps:
    - name: OCCT paths
      id: paths
      shell: bash
      run: |
        tmp="$RUNNER_TEMP"
        # Forward slashes on Windows (D:/a/_temp): safe for CMake and build.rs.
        if [ "$RUNNER_OS" = "Windows" ]; then tmp="$(cygpath -m "$tmp")"; fi
        echo "prefix=$tmp/occt-${{ inputs.occt-tag }}" >> "$GITHUB_OUTPUT"
        echo "work=$tmp/ob" >> "$GITHUB_OUTPUT"

    - name: Restore OCCT cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.paths.outputs.prefix }}
        key: occt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.occt-tag }}-${{ hashFiles(runner.os == 'Windows' && 'scripts/build-occt.ps1' || 'scripts/build-occt.sh') }}

    - name: Build OCCT (Linux/macOS)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      env:
        OCCT_TAG: ${{ inputs.occt-tag }}
        OCCT_WORK: ${{ steps.paths.outputs.work }}
      run: scripts/build-occt.sh "${{ steps.paths.outputs.prefix }}"

    - name: Build OCCT (Windows)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        OCCT_TAG: ${{ inputs.occt-tag }}
        OCCT_WORK: ${{ steps.paths.outputs.work }}
      run: scripts/build-occt.ps1 "${{ steps.paths.outputs.prefix }}"

    # Save immediately (not in a post step) so a later cargo failure does not
    # throw away a 30-60 minute OCCT build.
    - name: Save OCCT cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.paths.outputs.prefix }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Export OCCT_ROOT
      shell: bash
      run: echo "OCCT_ROOT=${{ steps.paths.outputs.prefix }}" >> "$GITHUB_ENV"
