name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Trunk-based (10-25): agents push to main many times a day, so only the newest main commit is built; a newer push
  # cancels the older run. Releases are cut from the lead's last-green tag and get their own release workflow run.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  commit-messages:
    name: No AI attribution in history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject Co-Authored-By Claude / "Generated with Claude Code" lines
        run: |
          bad=$(git log --format='%H %B' | grep -iE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude code' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "::error::AI attribution lines in commit messages"; exit 1; fi

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04 # validated image; ubuntu-latest moves to 26.04 from 2026-10-19
            exe: noshape
          - name: macOS arm64
            os: macos-latest
            exe: noshape
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            exe: noshape.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev \
            mesa-vulkan-drivers # lavapipe: a software Vulkan adapter, so the offscreen render tests run without a GPU

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja || true
          # GPUI compiles its Metal shaders at build time (xcrun metal).
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Load vcvars64 into the job environment (cl, link, INCLUDE, LIB...).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: occt-V8_0_1

      - name: Build (release)
        run: cargo build --release --locked -p noshape

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: noshape-${{ runner.os }}-${{ runner.arch }}
          path: target/release/${{ matrix.exe }}
          if-no-files-found: error

      - name: Test
        run: cargo test --locked --workspace --exclude noshape

      # The whole workspace (app included, tests included) must be warning-free.
      - name: Clippy (-D warnings)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
