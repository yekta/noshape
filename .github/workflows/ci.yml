name: CI

on:
  # Test tiers (docs/TESTS.md). The lead's watcher tests every main commit with T0+T1 on Linux and moves the tag
  # `last-green`. CI runs T1 on Linux, macOS and Windows: every 3 hours on the current last-green (scheduled, so runs
  # don't cancel each other; a tag push per green commit did, 10-27); a release branch with cherry-picked fixes gets a
  # run from cut-release.sh (workflow_dispatch). T2
  # (deep) runs Sundays on all three and never blocks anything.
  push:
    branches: [ci]
  pull_request:
  schedule:
    - cron: '17 */3 * * *' # T1 on the current last-green
    - cron: '0 2 * * 0'    # Sundays 02:00 UTC: T2 on main
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tests to run: t1 (core, default) or t2 (deep)'
        type: choice
        options: [t1, t2]
        default: t1
      save_caches:
        description: 'Save the rust and compiler caches as main does (to measure warm runs on a branch)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # The big caches (rust-cache, OCCT's compiler cache) are saved from main only, so the 10 GB quota holds one per OS
  # and job; other refs restore main's. prune-caches deletes what they replace.
  NOSHAPE_SAVE_CACHES: ${{ github.ref == 'refs/heads/main' || inputs.save_caches == true }}

jobs:
  commit-messages:
    name: No AI attribution in history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject Co-Authored-By Claude / "Generated with Claude Code" lines
        run: |
          bad=$(git log --format='%H %B' | grep -iE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude code' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "::error::AI attribution lines in commit messages"; exit 1; fi

  # OpenCascade once per OS (restored when this patch set was built before, else built through ccache), for the
  # jobs below, which restore it in seconds.
  occt:
    name: OCCT ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04 # validated image; ubuntu-latest moves to 26.04 from 2026-10-19
          - name: macOS arm64
            os: macos-latest
          - name: Windows x86_64 (MSVC)
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.schedule == '17 */3 * * *' && 'refs/tags/last-green' || '' }}

      - name: Build tools
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) command -v ninja || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ninja-build; } ;;
            macOS) command -v ninja || brew install ninja ;;
          esac

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

  # T1 (or T2) and clippy. Beside `release`, not after it: each OS's wall time is OCCT + the slower of the two.
  test:
    name: Test ${{ matrix.name }}
    needs: occt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-latest
          - name: Windows x86_64 (MSVC)
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scheduled T1 runs test the current last-green (the watcher's newest green main commit).
          ref: ${{ github.event.schedule == '17 */3 * * *' && 'refs/tags/last-green' || '' }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev \
            mesa-vulkan-drivers # lavapipe: a software Vulkan adapter, so the offscreen render tests run without a GPU

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # GPUI compiles its Metal shaders at build time (xcrun metal).
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Load vcvars64 into the job environment (cl, link, INCLUDE, LIB...).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: occt-V8_0_1
          save-if: ${{ env.NOSHAPE_SAVE_CACHES == 'true' }}

      # Windows runs the tiers in PowerShell: in Git Bash, /usr/bin/link shadows MSVC's link.exe and every build script
      # fails to link (10-27).
      - name: Test (T1 core)
        if: github.event.schedule != '0 2 * * 0' && inputs.tier != 't2' && runner.os != 'Windows'
        shell: bash
        run: tools/tiers/t1.sh --locked --no-fail-fast

      - name: Test (T1 core, Windows)
        if: github.event.schedule != '0 2 * * 0' && inputs.tier != 't2' && runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked --workspace --no-fail-fast

      - name: Test (T2 deep; never blocks)
        if: (github.event.schedule == '0 2 * * 0' || inputs.tier == 't2') && runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: tools/tiers/t2.sh --locked

      - name: Test (T2 deep, Windows; never blocks)
        if: (github.event.schedule == '0 2 * * 0' || inputs.tier == 't2') && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $names = python tools/tiers/t2-names.py .
          cargo test --locked --workspace --no-fail-fast -- --ignored --exact @names

      # The whole workspace (app included, tests included) must be warning-free.
      - name: Clippy (-D warnings)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # The release build of the app (the binary as shipped) and the CLI. Its rust cache is shared with release.yml's
  # bundles and perf.yml (shared-key), so a release restores main's dependencies.
  release:
    name: Release build ${{ matrix.name }}
    needs: occt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            exe: noshape
          - name: macOS arm64
            os: macos-latest
            exe: noshape
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            exe: noshape.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.schedule == '17 */3 * * *' && 'refs/tags/last-green' || '' }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-occt-V8_0_1
          save-if: ${{ env.NOSHAPE_SAVE_CACHES == 'true' }}

      - name: Build (release)
        run: cargo build --release --locked -p noshape -p noshape-cli

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: noshape-${{ runner.os }}-${{ runner.arch }}
          path: target/release/${{ matrix.exe }}
          if-no-files-found: error

  # Main keeps one cache of each kind per OS: older ones it replaced, and release tags' (never reused), are deleted.
  prune-caches:
    name: Prune caches
    needs: [test, release]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/prune_caches.py
