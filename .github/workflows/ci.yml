name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # kern-dev (debug, not for main): the macOS features_a SIGSEGV.
          - name: macOS arm64
            os: macos-latest
            exe: noshape
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja || true
          # GPUI compiles its Metal shaders at build time (xcrun metal).
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Load vcvars64 into the job environment (cl, link, INCLUDE, LIB...).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: occt-V8_0_1

      - name: features_a one test at a time
        run: cargo test --locked -p noshape-model --test features_a -- --test-threads=1 2>&1 | tee features_a.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true

      - name: features_a under lldb (native backtrace)
        shell: bash
        run: |
          bin=$(cargo test --locked -p noshape-model --test features_a --no-run --message-format=json 2>/dev/null | python3 -c 'import sys,json
          for l in sys.stdin:
              try: m=json.loads(l)
              except Exception: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and "features_a" in m["executable"]: print(m["executable"])' | tail -1)
          echo "binary: $bin"
          lldb --batch -o "run" -k "thread backtrace all" -k "quit 1" -- "$bin" --test-threads=1 2>&1 | tail -400
      # The whole workspace (app included, tests included) must be warning-free.
      - name: Clippy (-D warnings)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
