# One-off (lead, 11-09): times a user's document on macOS and Windows with the v0.4.39 CLI. The document comes
# encrypted from a short-lived private share (secrets DOCK_PROBE_URL / DOCK_PROBE_KEY); nothing is uploaded or kept.
name: dock-probe
on:
  push:
    branches: [lead-dock-probe]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, asset: macos-arm64, ext: tar.gz }
          - { os: windows-latest, asset: windows-x86_64, ext: zip }
          - { os: ubuntu-24.04, asset: linux-x86_64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      URL: ${{ secrets.DOCK_PROBE_URL }}
      KEY: ${{ secrets.DOCK_PROBE_KEY }}
    steps:
      - name: Probe
        run: |
          set +e +o pipefail
          w="$RUNNER_TEMP/p"; mkdir -p "$w"; cd "$w"
          gh release download v0.4.39 -R "$GITHUB_REPOSITORY" -p "noshape-cli-0.4.39-${{ matrix.asset }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = zip ]; then unzip -q *.zip; else tar xzf *.tar.gz; fi
          C=$(find . -type f \( -name noshape-cli -o -name noshape-cli.exe \) | head -1); echo "cli $C"
          curl -fsSL "$URL" -o d.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -in d.enc -out dock.noshape -pass "pass:$KEY"; rm -f d.enc
          export HOME="$w/home"; mkdir -p "$HOME"
          summ() { jq -c '{n: (.features|length), sum_ms: ([.features[].regen_ms // 0]|add|floor), not_ok: [.features[]|select(.status!="Ok" and .status!="Suppressed")|[.name,.status,.message]], top: ([.features[]|[(.regen_ms // 0|floor), .name]]|sort|.[-5:])}' "$1" || head -c 300 "$1"; }
          t() { local s=$(date +%s%N); "$@"; local e=$?; echo "  wall $(( ($(date +%s%N) - s) / 1000000 )) ms (exit $e)" >&2; }
          run() { echo "== $1"; shift; t "$@" > f.json 2> f.err; grep wall f.err; summ f.json; grep -v wall f.err | tail -3; }
          run "open E2" "$C" feature list --doc dock.noshape --tab "E2 - C Stand"
          run "open E1-30" "$C" feature list --doc dock.noshape --tab "E1-30 - Egik Gece Standi"
          for v in "50 mm" "30 mm"; do
            cp dock.noshape dh.noshape
            echo "== E1-30 #Hs = $v: set"; t "$C" variable set --doc dh.noshape --tab "E1-30 - Egik Gece Standi" --variable "#Hs" --value "$v" > s.json 2> s.err; cat s.err | tail -2
            run "E1-30 #Hs = $v: rebuild" "$C" feature list --doc dh.noshape --tab "E1-30 - Egik Gece Standi"
          done
          rm -rf "$w"
