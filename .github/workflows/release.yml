name: Release

on:
  push:
    tags: ['v*']
  # A dry run builds, bundles and checks every platform's downloads without publishing: on a branch,
  # `gh workflow run release.yml --ref <branch>` (docs/handoff/cliapp.md). On a tag, dry_run=false publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check the bundles only (no GitHub release)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Apple Developer ID signing and notarization (macOS) when these secrets exist; else the ad-hoc signature.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04 # validated image; ubuntu-latest moves to 26.04 from 2026-10-19
            asset: linux-x86_64
          - name: macOS arm64
            os: macos-latest
            asset: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="0.0.0-${GITHUB_SHA::7}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # The app shows it (crates/app main.rs `VERSION`).
          echo "NOSHAPE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja || true
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Load vcvars64 into the job environment (cl, link, INCLUDE, LIB...).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Read only: a tag's cache could never be read again, and the quota keeps main's (ci.yml).
      - uses: Swatinem/rust-cache@v2
        with:
          key: occt-V8_0_1
          save-if: false

      - name: Build (release)
        # The app (which is also the CLI and the MCP server: `noshape mcp`), the headless CLI for servers, and (Windows)
        # noshape.com, the console launcher terminals run for `noshape`.
        run: cargo build --release --locked -p noshape -p noshape-cli -p noshape-launcher

      # A temporary keychain with the Developer ID Application certificate (APPLE_CERT_P12, base64).
      - name: Apple signing identity (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; pw=$(openssl rand -hex 16)
          echo "$APPLE_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          [ -n "$id" ] || { echo "no Developer ID Application identity in APPLE_CERT_P12"; exit 1; }
          echo "APPLE_SIGN_ID=$id" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Bundle (macOS .app in .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          app=dist/noshape.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/noshape "$app/Contents/MacOS/noshape"
          cp packaging/icons/noshape.icns "$app/Contents/Resources/noshape.icns"
          packaging/macos/metallibs.sh "$app"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          strip -x "$app/Contents/MacOS/noshape"
          # Notarize what's given (a zip or a dmg) and wait for Apple's answer.
          notarize() { xcrun notarytool submit "$1" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait; }
          if [ -n "${APPLE_SIGN_ID:-}" ]; then
            # Developer ID with the hardened runtime and a timestamp, notarized and stapled when the API key is set.
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGN_ID" "$app"
            if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
              ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
              notarize "$RUNNER_TEMP/notarize.zip"
              xcrun stapler staple "$app"
            fi
          else
            # Ad-hoc signature so Apple Silicon will launch it (not notarized).
            codesign --force --deep --sign - "$app"
          fi
          # The app alone, for in-app updates (the bundle is swapped in place; a download inside the app has no
          # quarantine flag).
          ditto -c -k --keepParent "$app" "out/noshape-$VERSION-${{ matrix.asset }}.app.zip"
          ln -s /Applications dist/Applications
          # hdiutil underestimates the image size for large binaries; size it explicitly.
          size_mb=$(( $(du -sm dist | cut -f1) * 2 + 64 ))
          dmg="out/noshape-$VERSION-${{ matrix.asset }}.dmg"
          hdiutil create -volname noshape -srcfolder dist -ov -fs HFS+ -size "${size_mb}m" -format UDZO "$dmg"
          if [ -n "${APPLE_SIGN_ID:-}" ]; then
            codesign --force --timestamp --sign "$APPLE_SIGN_ID" "$dmg"
            if [ -n "${APPLE_API_KEY_PATH:-}" ]; then notarize "$dmg" && xcrun stapler staple "$dmg"; fi
          fi

      - name: Bundle (Linux tar.gz and .deb)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          d="noshape-$VERSION-${{ matrix.asset }}"
          mkdir -p "$d"
          cp target/release/noshape "$d/"
          strip "$d/noshape"
          cp packaging/linux/noshape.desktop packaging/linux/install.sh README.md "$d/"
          cp packaging/icons/noshape-512.png "$d/noshape.png"
          cp packaging/icons/noshape.svg "$d/noshape.svg"
          tar czf "out/$d.tar.gz" "$d"
          # The .deb: /usr/bin/noshape, the menu entry and icons.
          pkg=deb/noshape
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/512x512/apps" \
            "$pkg/usr/share/icons/hicolor/scalable/apps" "$pkg/usr/share/doc/noshape"
          cp "$d/noshape" "$pkg/usr/bin/noshape"
          cp packaging/linux/noshape.desktop "$pkg/usr/share/applications/"
          cp "$d/noshape.png" "$pkg/usr/share/icons/hicolor/512x512/apps/noshape.png"
          cp "$d/noshape.svg" "$pkg/usr/share/icons/hicolor/scalable/apps/noshape.svg"
          cp README.md "$pkg/usr/share/doc/noshape/"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SIZE@/$(du -sk "$pkg/usr" | cut -f1)/" packaging/linux/deb-control > "$pkg/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$pkg" "out/noshape-$VERSION-${{ matrix.asset }}.deb"

      - name: Bundle (Windows installer and zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $d = "noshape-$env:VERSION-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item target/release/noshape.exe, README.md $d
          Copy-Item target/release/noshape-launcher.exe "$d/noshape.com"
          Compress-Archive -Path $d -DestinationPath "out/$d.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersion=$env:VERSION" "/DSource=$PWD\target\release" "/DOutput=$PWD\out" packaging\windows\noshape.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }

      - name: CLI-only download (headless noshape-cli, for servers)
        shell: bash
        run: |
          c="noshape-cli-$VERSION-${{ matrix.asset }}"
          mkdir -p "$c"
          cp README.md "$c/"
          case "$RUNNER_OS" in
            Windows)
              cp target/release/noshape-cli.exe "$c/"
              pwsh -NoProfile -Command "Compress-Archive -Path '$c' -DestinationPath 'out/$c.zip'" ;;
            macOS)
              cp target/release/noshape-cli "$c/" && strip -x "$c/noshape-cli"
              if [ -n "${APPLE_SIGN_ID:-}" ]; then codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_ID" "$c/noshape-cli"; else codesign --force --sign - "$c/noshape-cli"; fi
              tar czf "out/$c.tar.gz" "$c" ;;
            Linux)
              cp target/release/noshape-cli "$c/" && strip "$c/noshape-cli"
              tar czf "out/$c.tar.gz" "$c" ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  # Every download signed with noshape's update key (minisign, ed25519; the app embeds the public key and refuses an
  # update whose signature or checksum doesn't verify): SHA256SUMS over all of them, and a .minisig per file whose
  # signed comment names the version and the file (no asset can stand in for another's or an older one's).
  sign:
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-*64'
          path: dist
          merge-multiple: true
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::the UPDATE_SIGNING_KEY secret is missing"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="0.0.0-${GITHUB_SHA::7}"
          sudo apt-get install -y -q minisign >/dev/null
          key="$RUNNER_TEMP/update.key"
          ( umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key" )
          cd dist
          sha256sum -- * > SHA256SUMS
          for f in *; do
            minisign -S -s "$key" -m "$f" -t "noshape $v file:$f" < /dev/null > /dev/null
          done
          rm -f "$key"
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  # Every platform's downloads on a fresh runner: installed as a user would, then `noshape --version` and
  # `noshape mcp` (initialize + tools/list over pipes) through the PATH entry the install made.
  verify:
    name: Check ${{ matrix.name }}
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            asset: linux-x86_64
          - name: macOS arm64
            os: macos-latest
            asset: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: dl

      - name: Linux (CLI-only, .deb, install.sh)
        if: runner.os == 'Linux'
        run: |
          set -x
          check=.github/release/check_binary.py
          # On the clean runner first: the CLI-only download needs no desktop libraries.
          tar xzf dl/noshape-cli-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          python3 $check "$(ls "$RUNNER_TEMP"/noshape-cli-*/noshape-cli)" noshape-cli
          # The .deb: apt pulls in its dependencies (the desktop libraries the app links).
          sudo apt-get update -q
          sudo apt-get install -y ./dl/noshape-[0-9]*-linux-x86_64.deb
          test -x /usr/bin/noshape
          python3 $check /usr/bin/noshape
          test -f /usr/share/applications/noshape.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/noshape.png
          sudo apt-get remove -y noshape
          test ! -e /usr/bin/noshape
          # The tarball's install.sh (the libraries are there now, as on a desktop). A fake Claude Code on PATH:
          # --agents registers noshape with it (`claude mcp add`).
          tar xzf dl/noshape-[0-9]*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          dir=$(ls -d "$RUNNER_TEMP"/noshape-[0-9]*/)
          mkdir -p "$RUNNER_TEMP/fake"
          printf '#!/bin/sh\necho "$*" >> "$HOME/claude-calls"\n' > "$RUNNER_TEMP/fake/claude"
          chmod +x "$RUNNER_TEMP/fake/claude"
          PATH="$RUNNER_TEMP/fake:$PATH" "$dir/install.sh" --agents
          grep -qx "mcp add --scope user noshape -- $HOME/.local/bin/noshape mcp" "$HOME/claude-calls"
          grep -q "^Exec=$HOME/.local/bin/noshape" "$HOME/.local/share/applications/noshape.desktop"
          test -f "$HOME/.local/share/icons/hicolor/512x512/apps/noshape.png"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(command -v noshape)" = "$HOME/.local/bin/noshape"
          python3 $check noshape
          # Uninstalling disconnects the agents from this binary (the fake leaves ~/.claude.json, so the file is edited).
          PATH="$RUNNER_TEMP/fake:$PATH" "$dir/install.sh" --uninstall
          test ! -e "$HOME/.local/bin/noshape"
          grep -qx "mcp remove --scope user noshape" "$HOME/claude-calls"
          if grep -q '"noshape"' "$HOME/.claude.json"; then echo "uninstall left Claude Code connected"; exit 1; fi

      - name: macOS (dmg, command line tool link, CLI-only)
        if: runner.os == 'macOS'
        run: |
          set -x
          check=.github/release/check_binary.py
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dl/noshape-*-macos-arm64.dmg
          test ! -e "$RUNNER_TEMP/dmg/noshape-cli"
          cp -R "$RUNNER_TEMP/dmg/noshape.app" /Applications/noshape.app
          hdiutil detach "$RUNNER_TEMP/dmg"
          test "$(ls /Applications/noshape.app/Contents/MacOS)" = noshape
          app=/Applications/noshape.app/Contents/MacOS/noshape
          python3 $check "$app"
          # What Help › Install command line tool… does (the admin prompt aside): /usr/local/bin/noshape → the app.
          sudo mkdir -p /usr/local/bin && sudo chown "$(id -u)" /usr/local/bin
          "$app" cli install --dir /usr/local/bin
          test "$(readlink /usr/local/bin/noshape)" = "$app"
          export PATH="/usr/local/bin:$PATH"
          test "$(command -v noshape)" = /usr/local/bin/noshape
          python3 $check noshape
          noshape cli status | grep -q '"on_path": true'
          tar xzf dl/noshape-cli-*-macos-arm64.tar.gz -C "$RUNNER_TEMP"
          python3 $check "$(ls "$RUNNER_TEMP"/noshape-cli-*/noshape-cli)" noshape-cli

      - name: Windows (installer, PATH, terminal launcher, uninstall, zip, CLI-only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $check = ".github/release/check_binary.py"
          $setup = (Get-ChildItem dl\noshape-*-windows-x86_64-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exit $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\noshape"
          if (-not (Test-Path "$dir\noshape.exe")) { throw "not installed to $dir" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\noshape.lnk")) { throw "no Start menu entry" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { throw "$dir not on the user PATH: $userPath" }
          # A new terminal's PATH: `noshape` is the console launcher; typed commands print before the next prompt.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $userPath
          & .github/release/check_terminal.ps1 $dir
          if ($LASTEXITCODE -ne 0) { throw "terminal check failed" }
          # Opening a document shows no console window; the last release, for comparison (it flashed one per open).
          & .github/release/check_no_console.ps1 "$dir\noshape.exe"
          if ($LASTEXITCODE -ne 0) { throw "console window check failed" }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern "noshape-[0-9]*-windows-x86_64.zip" --dir "$env:RUNNER_TEMP\prev"
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive (Get-ChildItem "$env:RUNNER_TEMP\prev\*.zip").FullName -DestinationPath "$env:RUNNER_TEMP\prev"
            & .github/release/check_no_console.ps1 (Get-ChildItem "$env:RUNNER_TEMP\prev\noshape-*\noshape.exe").FullName -Report
          }
          python $check noshape
          if ($LASTEXITCODE -ne 0) { throw "check failed" }
          # MCP through the launcher too (a client that resolves `noshape` as cmd does).
          python $check "$dir\noshape.com"
          if ($LASTEXITCODE -ne 0) { throw "launcher MCP check failed" }
          # Claude Desktop connected by this install (another server in its file): uninstalling disconnects it.
          $claude = "$env:APPDATA\Claude"
          New-Item -ItemType Directory -Force -Path $claude | Out-Null
          '{"mcpServers":{"other":{"command":"other.exe","args":[]}}}' | Set-Content -Encoding ascii "$claude\claude_desktop_config.json"
          noshape agents connect --agents claude_desktop | Out-String | Write-Host
          $cfg = Get-Content "$claude\claude_desktop_config.json" -Raw | ConvertFrom-Json
          if ($cfg.mcpServers.noshape.command -ne "$dir\noshape.exe") { throw "not connected: $($cfg | ConvertTo-Json -Depth 5)" }
          # The GUI-subsystem exe prints into a redirect from cmd and into PowerShell's pipe.
          cmd /c "noshape --version > `"$env:RUNNER_TEMP\v.txt`""
          if (-not ((Get-Content "$env:RUNNER_TEMP\v.txt") -match '^noshape ')) { throw "cmd redirect: $(Get-Content "$env:RUNNER_TEMP\v.txt")" }
          $v = noshape --version | Out-String
          if ($v -notmatch '^noshape ') { throw "pipe: $v" }
          # Uninstall: the files and the PATH entry go.
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exit $($u.ExitCode)" }
          # The uninstaller finishes from a copy of itself: wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\noshape.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\noshape.exe") { throw "uninstall left noshape.exe" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir) { throw "uninstall left the PATH entry" }
          $cfg = Get-Content "$claude\claude_desktop_config.json" -Raw | ConvertFrom-Json
          if ($cfg.mcpServers.noshape) { throw "uninstall left Claude Desktop connected" }
          if ($cfg.mcpServers.other.command -ne 'other.exe') { throw "uninstall changed another server" }
          # The portable zip and the CLI-only download.
          Expand-Archive (Get-ChildItem dl\noshape-[0-9]*-windows-x86_64.zip).FullName -DestinationPath "$env:RUNNER_TEMP\zip"
          python $check (Get-ChildItem "$env:RUNNER_TEMP\zip\noshape-*\noshape.exe").FullName
          if ($LASTEXITCODE -ne 0) { throw "zip check failed" }
          Expand-Archive (Get-ChildItem dl\noshape-cli-*-windows-x86_64.zip).FullName -DestinationPath "$env:RUNNER_TEMP\cli"
          python $check (Get-ChildItem "$env:RUNNER_TEMP\cli\noshape-cli-*\noshape-cli.exe").FullName noshape-cli
          if ($LASTEXITCODE -ne 0) { throw "CLI check failed" }

  publish:
    needs: [bundle, sign, verify]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signed
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The lead's notes for this release (tools/lead/cut-release.sh puts them on the release branch), never
          # GitHub's generated list (it only knows pull requests).
          if gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_NOTES.md?ref=$GITHUB_REF_NAME" --jq .content > notes.b64; then
            base64 -d notes.b64 > notes.md || true
          fi
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "noshape $GITHUB_REF_NAME" --notes-file notes.md
