name: Release

on:
  push:
    tags: ['v*']
  # A dry run builds, bundles and checks every platform's downloads without publishing: on a branch,
  # `gh workflow run release.yml --ref <branch>` (docs/handoff/cliapp.md). On a tag, dry_run=false publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check the bundles only (no GitHub release)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04 # validated image; ubuntu-latest moves to 26.04 from 2026-10-19
            asset: linux-x86_64
          - name: macOS arm64
            os: macos-latest
            asset: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="0.0.0-${GITHUB_SHA::7}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # The app shows it (crates/app main.rs `VERSION`).
          echo "NOSHAPE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja || true
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Load vcvars64 into the job environment (cl, link, INCLUDE, LIB...).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: C and C++ compiler
        uses: ./.github/actions/setup-cxx

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Read only: a tag's cache could never be read again, and the quota keeps main's (ci.yml).
      - uses: Swatinem/rust-cache@v2
        with:
          key: occt-V8_0_1
          save-if: false

      - name: Build (release)
        # The app (which is also the CLI and the MCP server: `noshape mcp`), the headless CLI for servers, and (Windows)
        # noshape.com, the console launcher terminals run for `noshape`.
        run: cargo build --release --locked -p noshape -p noshape-cli -p noshape-launcher

      # setup-cxx's GCC is newer than 24.04's own: the binaries must not need a newer libstdc++ than a stock 24.04 has
      # (its libstdc++6 is GCC 14's: GLIBCXX_3.4.33, CXXABI_1.3.15). The smoke job runs them on a fresh runner too.
      - name: Runs on a stock 24.04 (Linux)
        if: runner.os == 'Linux'
        run: |
          newest() { objdump -T "$1" | grep -oE "$2_[0-9.]+" | sort -uV | tail -1; }
          for b in target/release/noshape target/release/noshape-cli; do
            for want in GLIBCXX_3.4.33 CXXABI_1.3.15; do
              got=$(newest "$b" "${want%%_*}")
              echo "$b: ${got:-no ${want%%_*}} (24.04: $want)"
              if [ -n "$got" ] && [ "$(printf '%s\n' "$got" "$want" | sort -V | tail -1)" != "$want" ]; then
                echo "::error::$b needs $got, newer than a stock 24.04's $want"
                exit 1
              fi
            done
          done

      # Apple signing (macOS), when the secrets exist (else the ad-hoc signature): the Developer ID Application
      # certificate (APPLE_CERT_P12, base64; its password in APPLE_DEVID_CERT_PASSWORD, else APPLE_CERT_PASSWORD) in a
      # temporary keychain deleted at the end of the job, and the App Store Connect API key (ASC_KEY_P8, base64) for
      # notarization. Secret values are never printed (no `set -x` here).
      - name: Apple signing identity (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_DEVID_CERT_PASSWORD: ${{ secrets.APPLE_DEVID_CERT_PASSWORD }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pass="${APPLE_DEVID_CERT_PASSWORD:-$APPLE_CERT_PASSWORD}"
          if [ -z "$APPLE_CERT_P12" ] || [ -z "$pass" ]; then
            echo "::notice::no Developer ID Application certificate (APPLE_CERT_P12 and its password): ad-hoc signature, not notarized"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw=$(openssl rand -hex 16)
          echo "APPLE_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          ( umask 077; printf '%s' "$APPLE_CERT_P12" | base64 -d > "$RUNNER_TEMP/devid.p12" )
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          if ! security import "$RUNNER_TEMP/devid.p12" -k "$kc" -f pkcs12 -P "$pass" -T /usr/bin/codesign > /dev/null; then
            rm -f "$RUNNER_TEMP/devid.p12"
            echo "::error::APPLE_CERT_P12 didn't import (wrong password in APPLE_DEVID_CERT_PASSWORD / APPLE_CERT_PASSWORD?)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          [ -n "$id" ] || { echo "::error::no Developer ID Application identity in APPLE_CERT_P12"; exit 1; }
          case "$id" in *"(${APPLE_TEAM_ID:-?})") ;; *) echo "::error::the Developer ID certificate isn't team $APPLE_TEAM_ID's: $id"; exit 1 ;; esac
          echo "Signing as: $id"
          echo "APPLE_SIGN_ID=$id" >> "$GITHUB_ENV"
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            ( umask 077; printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8" )
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          else
            echo "::warning::no App Store Connect API key (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID): signed but not notarized"
          fi

      # The App Store provisioning profiles (for the later Mac App Store and iOS builds) must name the bundle ID in
      # Info.plist: their application identifier, team and expiry are public, printed here and compared (a warning:
      # this build doesn't use them).
      - name: App Store profiles name the bundle ID (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_MAC_APPSTORE_PROFILE: ${{ secrets.APPLE_MAC_APPSTORE_PROFILE }}
          APPLE_IOS_APPSTORE_PROFILE: ${{ secrets.APPLE_IOS_APPSTORE_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' packaging/macos/Info.plist)
          echo "Info.plist CFBundleIdentifier: $bundle_id"
          check() { # <name> <base64 profile> <entitlement key>
            [ -n "$2" ] || { echo "::notice::$1 profile not set"; return; }
            printf '%s' "$2" | base64 -d > "$RUNNER_TEMP/p.provision"
            security cms -D -i "$RUNNER_TEMP/p.provision" > "$RUNNER_TEMP/p.plist" 2> /dev/null || { echo "::warning::the $1 profile isn't a provisioning profile"; return; }
            pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/p.plist" 2> /dev/null || true; }
            appid=$(pb "Entitlements:$3"); team=$(pb 'TeamIdentifier:0')
            echo "$1 profile \"$(pb Name)\": $3 = $appid, team $team, expires $(pb ExpirationDate)"
            if [ "$appid" != "$team.$bundle_id" ]; then echo "::warning::the $1 profile is for $appid, Info.plist says $team.$bundle_id"; fi
            if [ -n "$APPLE_TEAM_ID" ] && [ "$team" != "$APPLE_TEAM_ID" ]; then echo "::warning::the $1 profile is team $team's, APPLE_TEAM_ID is $APPLE_TEAM_ID"; fi
            rm -f "$RUNNER_TEMP/p.provision" "$RUNNER_TEMP/p.plist"
          }
          check "Mac App Store" "$APPLE_MAC_APPSTORE_PROFILE" com.apple.application-identifier
          check "iOS App Store" "$APPLE_IOS_APPSTORE_PROFILE" application-identifier

      - name: Bundle (macOS .app in .dmg)
        if: runner.os == 'macOS'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p out
          app=dist/noshape.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/noshape "$app/Contents/MacOS/noshape"
          cp packaging/icons/noshape.icns "$app/Contents/Resources/noshape.icns"
          packaging/macos/metallibs.sh "$app"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          strip -x "$app/Contents/MacOS/noshape"
          # Notarize what's given (a zip or a dmg) with the App Store Connect API key and wait for Apple's answer
          # (Accepted, else Apple's log of what's wrong).
          notarize() {
            xcrun notarytool submit "$1" --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait \
              --output-format json > "$RUNNER_TEMP/notary.json" || true
            st=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2> /dev/null || echo "no answer")
            echo "notarization of $(basename "$1"): $st"
            if [ "$st" != Accepted ]; then
              sid=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2> /dev/null) && \
                xcrun notarytool log "$sid" --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
              return 1
            fi
          }
          if [ -n "${APPLE_SIGN_ID:-}" ]; then
            # Developer ID with the hardened runtime and a timestamp, notarized and stapled when the API key is set.
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGN_ID" "$app"
            if [ -n "${ASC_KEY_PATH:-}" ]; then
              ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
              notarize "$RUNNER_TEMP/notarize.zip"
              xcrun stapler staple "$app"
            fi
          else
            # Ad-hoc signature so Apple Silicon will launch it (not notarized).
            codesign --force --deep --sign - "$app"
          fi
          # The app alone, for in-app updates (the bundle is swapped in place; a download inside the app has no
          # quarantine flag).
          ditto -c -k --keepParent "$app" "out/noshape-$VERSION-${{ matrix.asset }}.app.zip"
          ln -s /Applications dist/Applications
          # hdiutil underestimates the image size for large binaries; size it explicitly.
          size_mb=$(( $(du -sm dist | cut -f1) * 2 + 64 ))
          dmg="out/noshape-$VERSION-${{ matrix.asset }}.dmg"
          hdiutil create -volname noshape -srcfolder dist -ov -fs HFS+ -size "${size_mb}m" -format UDZO "$dmg"
          if [ -n "${APPLE_SIGN_ID:-}" ]; then
            codesign --force --timestamp --sign "$APPLE_SIGN_ID" "$dmg"
            if [ -n "${ASC_KEY_PATH:-}" ]; then notarize "$dmg"; xcrun stapler staple "$dmg"; fi
          fi

      - name: Bundle (Linux tar.gz and .deb)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          d="noshape-$VERSION-${{ matrix.asset }}"
          mkdir -p "$d"
          cp target/release/noshape "$d/"
          strip "$d/noshape"
          cp packaging/linux/noshape.desktop packaging/linux/install.sh README.md "$d/"
          cp packaging/icons/noshape-512.png "$d/noshape.png"
          cp packaging/icons/noshape.svg "$d/noshape.svg"
          tar czf "out/$d.tar.gz" "$d"
          # The .deb: /usr/bin/noshape, the menu entry and icons.
          pkg=deb/noshape
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/512x512/apps" \
            "$pkg/usr/share/icons/hicolor/scalable/apps" "$pkg/usr/share/doc/noshape"
          cp "$d/noshape" "$pkg/usr/bin/noshape"
          cp packaging/linux/noshape.desktop "$pkg/usr/share/applications/"
          cp "$d/noshape.png" "$pkg/usr/share/icons/hicolor/512x512/apps/noshape.png"
          cp "$d/noshape.svg" "$pkg/usr/share/icons/hicolor/scalable/apps/noshape.svg"
          cp README.md "$pkg/usr/share/doc/noshape/"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SIZE@/$(du -sk "$pkg/usr" | cut -f1)/" packaging/linux/deb-control > "$pkg/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$pkg" "out/noshape-$VERSION-${{ matrix.asset }}.deb"

      - name: Bundle (Windows installer and zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $d = "noshape-$env:VERSION-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item target/release/noshape.exe, README.md $d
          Copy-Item target/release/noshape-launcher.exe "$d/noshape.com"
          Compress-Archive -Path $d -DestinationPath "out/$d.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersion=$env:VERSION" "/DSource=$PWD\target\release" "/DOutput=$PWD\out" packaging\windows\noshape.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }

      - name: CLI-only download (headless noshape-cli, for servers)
        shell: bash
        run: |
          c="noshape-cli-$VERSION-${{ matrix.asset }}"
          mkdir -p "$c"
          cp README.md "$c/"
          case "$RUNNER_OS" in
            Windows)
              cp target/release/noshape-cli.exe "$c/"
              pwsh -NoProfile -Command "Compress-Archive -Path '$c' -DestinationPath 'out/$c.zip'" ;;
            macOS)
              cp target/release/noshape-cli "$c/" && strip -x "$c/noshape-cli"
              if [ -n "${APPLE_SIGN_ID:-}" ]; then codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_ID" "$c/noshape-cli"; else codesign --force --sign - "$c/noshape-cli"; fi
              tar czf "out/$c.tar.gz" "$c" ;;
            Linux)
              cp target/release/noshape-cli "$c/" && strip "$c/noshape-cli"
              tar czf "out/$c.tar.gz" "$c" ;;
          esac
          ls -la out

      - name: Remove the signing keychain and the API key (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ]; then security delete-keychain "$APPLE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/devid.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  # SHA256SUMS over every download, signed keyless with Sigstore: cosign signs it with this workflow's GitHub OIDC
  # identity (a short-lived Fulcio certificate for ".../release.yml@refs/tags/v…", logged in Rekor) into
  # SHA256SUMS.sigstore.json. There is no signing key anywhere. The app accepts an update only with a bundle for exactly
  # release.yml at the release's own tag (crates/update sigstore.rs), and the file's line in SHA256SUMS. cosign stays
  # on 2.x: its bundles carry Rekor v1's signed entry timestamp, which the app's verifier checks.
  sign:
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-*64'
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2
      - name: Sign
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob --yes --new-bundle-format --bundle SHA256SUMS.sigstore.json SHA256SUMS
          id="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify-blob --new-bundle-format --bundle SHA256SUMS.sigstore.json --certificate-identity "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          mkdir ../sums && cp SHA256SUMS SHA256SUMS.sigstore.json ../sums/ && echo "$id" > ../sums/identity.txt
      - uses: actions/upload-artifact@v7
        with:
          name: signed
          path: dist/*
          if-no-files-found: error
      # What the verify jobs need to check an update (without every platform's downloads).
      - uses: actions/upload-artifact@v7
        with:
          name: sums
          path: sums/*
          if-no-files-found: error

  # Every platform's downloads on a fresh runner: installed as a user would, then `noshape --version` and
  # `noshape mcp` (initialize + tools/list over pipes) through the PATH entry the install made, and each install
  # updating itself to this build (.github/release/check_update.py: found, downloaded, verified against the signed
  # SHA256SUMS, applied, relaunched with its document; a changed download and another signer refused).
  verify:
    name: Check ${{ matrix.name }}
    needs: [bundle, sign]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            asset: linux-x86_64
          - name: macOS arm64
            os: macos-latest
            asset: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/release
            tests/perf
            tests/budget
            crates/update/src/lib.rs
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: dl
      - uses: actions/download-artifact@v8
        with:
          name: sums
          path: sums

      - name: Linux (CLI-only, .deb, install.sh)
        if: runner.os == 'Linux'
        run: |
          set -x
          check=.github/release/check_binary.py
          # On the clean runner first: the CLI-only download needs no desktop libraries.
          tar xzf dl/noshape-cli-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          python3 $check "$(ls "$RUNNER_TEMP"/noshape-cli-*/noshape-cli)" noshape-cli
          # The .deb: apt pulls in its dependencies (the desktop libraries the app links).
          sudo apt-get update -q
          sudo apt-get install -y ./dl/noshape-[0-9]*-linux-x86_64.deb
          test -x /usr/bin/noshape
          python3 $check /usr/bin/noshape
          test -f /usr/share/applications/noshape.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/noshape.png
          sudo apt-get remove -y noshape
          test ! -e /usr/bin/noshape
          # The tarball's install.sh (the libraries are there now, as on a desktop). A fake Claude Code on PATH:
          # --agents registers noshape with it (`claude mcp add`).
          tar xzf dl/noshape-[0-9]*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          dir=$(ls -d "$RUNNER_TEMP"/noshape-[0-9]*/)
          mkdir -p "$RUNNER_TEMP/fake"
          printf '#!/bin/sh\necho "$*" >> "$HOME/claude-calls"\n' > "$RUNNER_TEMP/fake/claude"
          chmod +x "$RUNNER_TEMP/fake/claude"
          PATH="$RUNNER_TEMP/fake:$PATH" "$dir/install.sh" --agents
          grep -qx "mcp add --scope user noshape -- $HOME/.local/bin/noshape mcp" "$HOME/claude-calls"
          grep -q "^Exec=$HOME/.local/bin/noshape" "$HOME/.local/share/applications/noshape.desktop"
          test -f "$HOME/.local/share/icons/hicolor/512x512/apps/noshape.png"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(command -v noshape)" = "$HOME/.local/bin/noshape"
          python3 $check noshape
          # It updates itself (the binary swapped) under Xvfb with lavapipe. A dry run only: a release build ignores the
          # test feed.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            sudo apt-get install -y -q --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
            xvfb-run -a -s "-screen 0 1280x800x24" python3 .github/release/check_update.py "$HOME/.local/bin/noshape" \
              "$(ls dl/noshape-[0-9]*-linux-x86_64.tar.gz)" sums "$(cat sums/identity.txt)" --inode "$HOME/.local/bin/noshape"
          fi
          # Uninstalling disconnects the agents from this binary (the fake leaves ~/.claude.json, so the file is edited).
          PATH="$RUNNER_TEMP/fake:$PATH" "$dir/install.sh" --uninstall
          test ! -e "$HOME/.local/bin/noshape"
          grep -qx "mcp remove --scope user noshape" "$HOME/claude-calls"
          if grep -q '"noshape"' "$HOME/.claude.json"; then echo "uninstall left Claude Code connected"; exit 1; fi

      - name: macOS (dmg, command line tool link, CLI-only)
        if: runner.os == 'macOS'
        run: |
          set -x
          check=.github/release/check_binary.py
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dl/noshape-*-macos-arm64.dmg
          test ! -e "$RUNNER_TEMP/dmg/noshape-cli"
          cp -R "$RUNNER_TEMP/dmg/noshape.app" /Applications/noshape.app
          hdiutil detach "$RUNNER_TEMP/dmg"
          test "$(ls /Applications/noshape.app/Contents/MacOS)" = noshape
          app=/Applications/noshape.app/Contents/MacOS/noshape
          # The bundle ID, and a Developer ID build accepted by Gatekeeper with its notarization ticket stapled.
          codesign -dv /Applications/noshape.app 2> "$RUNNER_TEMP/sig.txt"; cat "$RUNNER_TEMP/sig.txt"
          grep -qx 'Identifier=app.noshape.noshape' "$RUNNER_TEMP/sig.txt"
          codesign --verify --strict --deep /Applications/noshape.app
          if codesign -dvv /Applications/noshape.app 2>&1 | grep -q '^Authority=Developer ID Application'; then
            spctl -a -vv -t exec /Applications/noshape.app
            xcrun stapler validate /Applications/noshape.app
            xcrun stapler validate dl/noshape-*-macos-arm64.dmg
          fi
          python3 $check "$app"
          # It updates itself (the bundle swapped; the new one must carry the Developer ID signature). A dry run only.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            python3 .github/release/check_update.py "$app" "$(ls dl/noshape-*-macos-arm64.app.zip)" sums "$(cat sums/identity.txt)" \
              --inode /Applications/noshape.app
          fi
          # What Help › Install command line tool… does (the admin prompt aside): /usr/local/bin/noshape → the app.
          sudo mkdir -p /usr/local/bin && sudo chown "$(id -u)" /usr/local/bin
          "$app" cli install --dir /usr/local/bin
          test "$(readlink /usr/local/bin/noshape)" = "$app"
          export PATH="/usr/local/bin:$PATH"
          test "$(command -v noshape)" = /usr/local/bin/noshape
          python3 $check noshape
          noshape cli status | grep -q '"on_path": true'
          tar xzf dl/noshape-cli-*-macos-arm64.tar.gz -C "$RUNNER_TEMP"
          python3 $check "$(ls "$RUNNER_TEMP"/noshape-cli-*/noshape-cli)" noshape-cli

      - name: Windows (installer, PATH, terminal launcher, uninstall, zip, CLI-only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $check = ".github/release/check_binary.py"
          $setup = (Get-ChildItem dl\noshape-*-windows-x86_64-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exit $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\noshape"
          if (-not (Test-Path "$dir\noshape.exe")) { throw "not installed to $dir" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\noshape.lnk")) { throw "no Start menu entry" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { throw "$dir not on the user PATH: $userPath" }
          # A new terminal's PATH: `noshape` is the console launcher; typed commands print before the next prompt.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $userPath
          & .github/release/check_terminal.ps1 $dir
          if ($LASTEXITCODE -ne 0) { throw "terminal check failed" }
          # Opening a document shows no console window; the last release, for comparison (it flashed one per open).
          & .github/release/check_no_console.ps1 "$dir\noshape.exe"
          if ($LASTEXITCODE -ne 0) { throw "console window check failed" }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern "noshape-[0-9]*-windows-x86_64.zip" --dir "$env:RUNNER_TEMP\prev"
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive (Get-ChildItem "$env:RUNNER_TEMP\prev\*.zip").FullName -DestinationPath "$env:RUNNER_TEMP\prev"
            & .github/release/check_no_console.ps1 (Get-ChildItem "$env:RUNNER_TEMP\prev\noshape-*\noshape.exe").FullName -Report
          }
          python $check noshape
          if ($LASTEXITCODE -ne 0) { throw "check failed" }
          # MCP through the launcher too (a client that resolves `noshape` as cmd does).
          python $check "$dir\noshape.com"
          if ($LASTEXITCODE -ne 0) { throw "launcher MCP check failed" }
          # Claude Desktop connected by this install (another server in its file): uninstalling disconnects it.
          $claude = "$env:APPDATA\Claude"
          New-Item -ItemType Directory -Force -Path $claude | Out-Null
          '{"mcpServers":{"other":{"command":"other.exe","args":[]}}}' | Set-Content -Encoding ascii "$claude\claude_desktop_config.json"
          noshape agents connect --agents claude_desktop | Out-String | Write-Host
          $cfg = Get-Content "$claude\claude_desktop_config.json" -Raw | ConvertFrom-Json
          if ($cfg.mcpServers.noshape.command -ne "$dir\noshape.exe") { throw "not connected: $($cfg | ConvertTo-Json -Depth 5)" }
          # The GUI-subsystem exe prints into a redirect from cmd and into PowerShell's pipe.
          cmd /c "noshape --version > `"$env:RUNNER_TEMP\v.txt`""
          if (-not ((Get-Content "$env:RUNNER_TEMP\v.txt") -match '^noshape ')) { throw "cmd redirect: $(Get-Content "$env:RUNNER_TEMP\v.txt")" }
          $v = noshape --version | Out-String
          if ($v -notmatch '^noshape ') { throw "pipe: $v" }
          # It updates itself (the new installer run silently; noshape.com, a stub first, is a real file again). A dry
          # run only: a release build ignores the test feed.
          $identity = (Get-Content sums\identity.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            python .github/release/check_update.py "$dir\noshape.exe" $setup sums $identity --stub "$dir\noshape.com"
            if ($LASTEXITCODE -ne 0) { throw "installer update check failed" }
            if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw "the update lost the PATH entry" }
            $cfg = Get-Content "$claude\claude_desktop_config.json" -Raw | ConvertFrom-Json
            if ($cfg.mcpServers.noshape.command -ne "$dir\noshape.exe") { throw "the update disconnected Claude Desktop" }
          }
          # Uninstall: the files and the PATH entry go.
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exit $($u.ExitCode)" }
          # The uninstaller finishes from a copy of itself: wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\noshape.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\noshape.exe") { throw "uninstall left noshape.exe" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir) { throw "uninstall left the PATH entry" }
          $cfg = Get-Content "$claude\claude_desktop_config.json" -Raw | ConvertFrom-Json
          if ($cfg.mcpServers.noshape) { throw "uninstall left Claude Desktop connected" }
          if ($cfg.mcpServers.other.command -ne 'other.exe') { throw "uninstall changed another server" }
          # The portable zip and the CLI-only download.
          $zip = (Get-ChildItem dl\noshape-[0-9]*-windows-x86_64.zip).FullName
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\zip"
          $zexe = (Get-ChildItem "$env:RUNNER_TEMP\zip\noshape-*\noshape.exe").FullName
          python $check $zexe
          if ($LASTEXITCODE -ne 0) { throw "zip check failed" }
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            python .github/release/check_update.py $zexe $zip sums $identity --stub (Join-Path (Split-Path $zexe) 'noshape.com')
            if ($LASTEXITCODE -ne 0) { throw "portable update check failed" }
          }
          Expand-Archive (Get-ChildItem dl\noshape-cli-*-windows-x86_64.zip).FullName -DestinationPath "$env:RUNNER_TEMP\cli"
          python $check (Get-ChildItem "$env:RUNNER_TEMP\cli\noshape-cli-*\noshape-cli.exe").FullName noshape-cli
          if ($LASTEXITCODE -ne 0) { throw "CLI check failed" }

      # This installer updating installs across UAC, as for a user with UAC on (.github/release/uac): the helper of an
      # older release's Restart at Medium integrity, the installer elevated by UAC, a copy running from the install
      # folder (v0.4.28's helper with one met exit code 5 and ended in silence, 11-06). The old helpers (v0.4.28-29,
      # v0.4.30-33: they run every user's next update) and today's. On releases too: it gates the installer.
      - name: Windows update across UAC
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem dl\noshape-*-windows-x86_64-setup.exe).FullName
          $want = (Split-Path $setup -Leaf) -replace '^noshape-(.*)-windows-x86_64-setup\.exe$', '$1'
          $latest = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName).TrimStart('v')
          python .github/release/uac/extract_helper.py crates/update/src/lib.rs "$env:RUNNER_TEMP\helper-today.ps1"
          $uac = '.github/release/uac/update_across_uac.ps1'
          & $uac -From 0.4.28 -Helper .github/release/uac/helpers/0.4.28.ps1 -Setup $setup -Want $want -Mcp
          if ($LASTEXITCODE -ne 0) { throw "v0.4.28's helper didn't update" }
          & $uac -From $latest -Helper .github/release/uac/helpers/0.4.32.ps1 -Setup $setup -Want $want -ElevatedMcp
          if ($LASTEXITCODE -ne 0) { throw "v0.4.32's helper didn't update" }
          & $uac -From $latest -Helper "$env:RUNNER_TEMP\helper-today.ps1" -Setup $setup -Want $want -Version $want -Mcp
          if ($LASTEXITCODE -ne 0) { throw "today's helper didn't update" }
          # A program with noshape.exe loaded, in a console it shares: untouched, the install waits for it.
          & $uac -From $latest -Helper "$env:RUNNER_TEMP\helper-today.ps1" -Setup $setup -Want $want -Version $want -Reader 20
          if ($LASTEXITCODE -ne 0) { throw "the update closed another program or didn't wait for it" }

      # The release's speed on each platform, through its CLI-only download (qa's 1.5x between green and v0.4.32 on
      # release-fillet-hang was green's x86-64-v3 OCCT, 11-06). Not a gate: a table in the job summary.
      - name: Regeneration times
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cli=$(ls "$(cygpath -u "$RUNNER_TEMP")"/cli/noshape-cli-*/noshape-cli.exe); py=python
          else
            cli=$(ls "$RUNNER_TEMP"/noshape-cli-*/noshape-cli); py=python3
          fi
          $py .github/release/time_cli.py "$cli" tests/perf/release-fillet-hang.noshape tests/perf/live-30-features.noshape \
            tests/perf/fins-400.noshape tests/perf/knurl-d25x25-45-45.noshape

      # A gate: the documents whose operations run into the kernel's budgets open on every platform within the limit.
      # Linux stops a budgeted op by its CPU timer, macOS and Windows only where OCCT checks the deadline, so a loop
      # that doesn't check it hangs there alone (draft-pool-hang never opened on macOS while it took 26 s on Linux, 11-06).
      - name: Budgeted documents
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cli=$(ls "$(cygpath -u "$RUNNER_TEMP")"/cli/noshape-cli-*/noshape-cli.exe); py=python
          else
            cli=$(ls "$RUNNER_TEMP"/noshape-cli-*/noshape-cli); py=python3
          fi
          $py .github/release/time_cli.py --limit 180 "$cli" tests/budget/*.noshape

  publish:
    needs: [bundle, sign, verify]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signed
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The lead's notes for this release (tools/lead/cut-release.sh puts them on the release branch), never
          # GitHub's generated list (it only knows pull requests).
          if gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_NOTES.md?ref=$GITHUB_REF_NAME" --jq .content > notes.b64; then
            base64 -d notes.b64 > notes.md || true
          fi
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "noshape $GITHUB_REF_NAME" --notes-file notes.md

  # The previous release, installed as a user installs it on each system, updates itself to the newest release from
  # GitHub through its own update card, Restart pressed on the screen (.github/release/check_restart.py: a release
  # build has no test hook). After publishing, the release just published; in a dry run, the latest from the one
  # before. It runs after the release is out, so a failure fails this job and says so in the run's summary.
  restart:
    name: Restart into ${{ matrix.name }}
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release
      - name: Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '[.[] | select(.draft | not) | select(.prerelease | not) | .tag_name] | .[0], .[1]' > releases.txt
          want=$(sed -n 1p releases.txt) prev=$(sed -n 2p releases.txt)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${{ needs.publish.result }}" = success ] && [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "### :x: The newest release on GitHub is $want, not $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "WANT=${want#v}" >> "$GITHUB_ENV"; echo "PREV=${prev#v}" >> "$GITHUB_ENV"
      - name: The previous release updates itself (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release/restart_unix.sh "$PREV" "$WANT"
      - name: The previous release updates itself (Windows, across UAC)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -q pillow
          & .github/release/restart_windows.ps1 -From $env:PREV -Want $env:WANT
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-${{ runner.os }}
          path: ${{ runner.temp }}/restart-shots
