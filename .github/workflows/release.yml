name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04 # validated image; ubuntu-latest moves to 26.04 from 2026-10-19
            asset: linux-x86_64
          - name: macOS arm64
            os: macos-latest
            asset: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="0.0.0-${GITHUB_SHA::7}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # The app shows it (crates/app main.rs `VERSION`).
          echo "NOSHAPE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxrandr-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libasound2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja || true
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Load vcvars64 into the job environment (cl, link, INCLUDE, LIB...).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: openNURBS (Rhino export)
        uses: ./.github/actions/setup-opennurbs

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: occt-V8_0_1

      - name: Build (release)
        # The app and the agent CLI / MCP server (noshape-cli), shipped side by side.
        run: cargo build --release --locked -p noshape -p noshape-cli

      - name: Bundle (macOS .app in .dmg)
        if: runner.os == 'macOS'
        run: |
          app=dist/noshape.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/noshape "$app/Contents/MacOS/noshape"
          cp target/release/noshape-cli "$app/Contents/MacOS/noshape-cli"
          cp packaging/icons/noshape.icns "$app/Contents/Resources/noshape.icns"
          packaging/macos/metallibs.sh "$app"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          strip -x "$app/Contents/MacOS/noshape"
          strip -x "$app/Contents/MacOS/noshape-cli"
          # Ad-hoc signatures so Apple Silicon will launch them (not notarized):
          # the CLI first (nested code), then the bundle.
          codesign --force --sign - "$app/Contents/MacOS/noshape-cli"
          codesign --force --deep --sign - "$app"
          # The CLI also loose in the dmg, next to noshape.app (same signed binary).
          cp "$app/Contents/MacOS/noshape-cli" dist/noshape-cli
          ln -s /Applications dist/Applications
          # hdiutil underestimates the image size for large binaries; size it explicitly.
          size_mb=$(( $(du -sm dist | cut -f1) * 2 + 64 ))
          hdiutil create -volname noshape -srcfolder dist -ov -fs HFS+ -size "${size_mb}m" -format UDZO \
            "noshape-$VERSION-${{ matrix.asset }}.dmg"
          echo "ASSET=noshape-$VERSION-${{ matrix.asset }}.dmg" >> "$GITHUB_ENV"

      - name: Bundle (Linux tar.gz)
        if: runner.os == 'Linux'
        run: |
          d="noshape-$VERSION-${{ matrix.asset }}"
          mkdir -p "$d"
          cp target/release/noshape target/release/noshape-cli "$d/"
          strip "$d/noshape" "$d/noshape-cli"
          cp packaging/linux/noshape.desktop README.md "$d/"
          cp packaging/icons/noshape-512.png "$d/noshape.png"
          cp packaging/icons/noshape.svg "$d/noshape.svg"
          tar czf "$d.tar.gz" "$d"
          echo "ASSET=$d.tar.gz" >> "$GITHUB_ENV"

      - name: Bundle (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "noshape-$env:VERSION-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item target/release/noshape.exe, target/release/noshape-cli.exe, README.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          "ASSET=$d.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The lead's notes for this release (tools/lead/cut-release.sh puts them on the release branch), never
          # GitHub's generated list (it only knows pull requests).
          if gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_NOTES.md?ref=$GITHUB_REF_NAME" --jq .content > notes.b64; then
            base64 -d notes.b64 > notes.md || true
          fi
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "noshape $GITHUB_REF_NAME" --notes-file notes.md
