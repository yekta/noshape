name: Viewport performance

# Release smoke test on every macOS / Windows / Linux runner (job `smoke`),
# and viewport benchmarks (viewport.rs `OrbitBench`, docs/ARCHITECTURE.md
# "Measuring") of a release, or of any ref built from source, on real runners:
# macOS (Apple silicon, paravirtualized Metal: the reference), Windows (WARP)
# and Linux (Xvfb, lavapipe) smoke tests. Logs, screenshots and summary.json
# are uploaded; the summary table goes to the run page.
#
# Gates (.github/perf/analyze.py), chosen to carry over to real Macs rather than
# measure the runner's virtual GPU:
#   correctness  zero-copy frames equal read-back frames and are not black;
#   UI CPU       UI-thread CPU p95 per orbit frame <= UI_CPU_P95_MS (macOS);
#   GPU          our GPU time per frame (wgpu timestamps) p95 <= GPU_P95_MS
#                (macOS; builds that report it);
#   regression   fps, frame-interval p95, UI CPU p95 and GPU p95 at most 10%
#                worse than the last successful run of this workflow on main.
#
# Releases are published by release.yml with GITHUB_TOKEN, which does not
# trigger `release: published` workflows, so this runs when Release completes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to measure (default: the latest release)'
        required: false
      ref:
        description: 'Build this branch/commit from source instead of a release'
        required: false
      frames:
        description: Frames per benchmark run
        required: false
        default: '300'
      jobs:
        description: Which jobs to run
        type: choice
        options: [all, smoke, bench, model]
        default: all
      variants:
        description: 'Extra texture orbit runs on macOS and Linux, e.g. msaa1:NOSHAPE_PERF_MSAA=1 noinst:NOSHAPE_PERF_SKIP=instancing'
        required: false
        default: ''
      fixture:
        description: 'Benchmark document in the repo (default the NIST assembly; tests/perf/parts-1000.noshape: 1000 parts, instancing). No baseline unless default'
        required: false
        default: ''
      env:
        description: 'Environment for every run on macOS and Linux, e.g. NOSHAPE_DISPLAY_MESH=chord. On macOS only the first orbit of a job is reliable for fps: compare settings in separate jobs'
        required: false
        default: ''
      modes:
        description: 'Presentation modes instead of the runner default, e.g. texture'
        required: false
        default: ''
      cold:
        description: 'macOS: clear the Metal shader cache before every launch, so each one is a cold start (any value)'
        required: false
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  FIXTURE: ${{ inputs.fixture || 'tests/perf/nist-mtc-crada-assembly.noshape' }}
  UI_CPU_P95_MS: '4'
  GPU_P95_MS: '6'
  MAX_REGRESSION: '0.10'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Release smoke test (crates/app/src/smoke.rs, .github/perf/smoke.sh): the
  # release build runs with NOSHAPE_SMOKE=1, which shows every cursor style
  # through the platform (v0.4.3 aborted on macOS 27 at the first Move
  # cursor), opens every studio, a sketch with the Dimension tool, the main
  # dialogs, panels and right-click menus, orbits and quits. A crash, abort,
  # hang or non-zero exit fails the job; its log and any crash reports
  # (~/Library/Logs/DiagnosticReports, Windows LocalDumps) are uploaded.
  # macOS: 14, 15 and the newest runner image (26; add the next one when
  # GitHub publishes it).
  smoke:
    name: Smoke ${{ matrix.name }}
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && inputs.jobs != 'bench' && inputs.jobs != 'model'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS 14, os: macos-14, asset: macos-arm64.dmg }
          - { name: macOS 15, os: macos-15, asset: macos-arm64.dmg }
          - { name: macOS 26, os: macos-26, asset: macos-arm64.dmg }
          - { name: Windows, os: windows-latest, asset: windows-x86_64.zip }
          - { name: Linux, os: ubuntu-24.04, asset: linux-x86_64.tar.gz }
    env:
      GH_TOKEN: ${{ github.token }}
      NOSHAPE_NO_NATIVE_DIALOGS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/noshape-binary
        with:
          tag: ${{ inputs.tag }}
          ref: ${{ inputs.ref }}
          asset: ${{ matrix.asset }}

      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        run: .github/perf/smoke.sh "$BIN" "$RUNNER_TEMP/smoke"

      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 \
            libxkbcommon-x11-0 libxcb-xkb1 libx11-xcb1 libfontconfig1
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 .github/perf/smoke.sh "$BIN" "$RUNNER_TEMP/smoke"

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Crash dumps of the app (Windows Error Reporting LocalDumps).
          $out = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\noshape.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $out -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          $env:NOSHAPE_SMOKE = '1'
          # Every cursor image as a .cur file, for the next step.
          $env:NOSHAPE_CURSOR_DUMP = "$out\cursor-files"
          $log = "$out\smoke.log"
          $p = Start-Process -FilePath $env:BIN -ArgumentList '--demo-drawing' -RedirectStandardError $log -RedirectStandardOutput "$out\stdout.log" -PassThru
          if (-not $p.WaitForExit(480000)) {
            Stop-Process -Id $p.Id -Force
            Add-Content $log 'SMOKE KILLED: no exit after 480s'
          }
          $p.WaitForExit()
          Start-Sleep -Seconds 5
          Select-String -Path $log -Pattern '^SMOKE' | ForEach-Object { $_.Line }
          '--- last lines of the log'
          Get-Content $log -Tail 40
          "exit status $($p.ExitCode)"
          Get-ChildItem $out
          if ($p.ExitCode -ne 0) { "::error::noshape exited with status $($p.ExitCode) (smoke test)"; exit 1 }
          if (-not (Select-String -Path $log -Pattern '^SMOKE done' -Quiet)) { '::error::noshape exited without finishing the smoke test'; exit 1 }

      # The cursors as Windows itself loads and draws them (LoadImage and
      # CreateIconIndirect, hot spots read back, drawn with DrawIconEx):
      # cursors/cursors-sheet.png and cursors.txt in the smoke artifact.
      - name: Cursors (Windows)
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: .github/perf/cursors.ps1 -CurDir "$env:RUNNER_TEMP\smoke\cursor-files" -OutDir "$env:RUNNER_TEMP\smoke\cursors"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn

  # A ref built from source for the macOS benchmarks: on the image the
  # release is built on (macos-latest, now macOS 26 with Xcode 26), not on
  # the measuring runner. Linked against the macOS 14 / 15 SDKs the same
  # code presents far fewer frames (v0.4.7 from source on the macOS 14 and
  # 15 runners: 19.1 fps orbiting parts-1000, its release DMG 33.5 fps).
  build-macos:
    name: Build (macOS, from source)
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && inputs.jobs != 'smoke' && inputs.jobs != 'model' && inputs.ref != ''
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/noshape-binary
        with:
          ref: ${{ inputs.ref }}
          asset: macos-arm64.dmg

      - name: Pack the app
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/noshape.app" "$RUNNER_TEMP/noshape-app.zip"
          echo "$BUILD" > "$RUNNER_TEMP/build.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: noshape-macos-app
          path: |
            ${{ runner.temp }}/noshape-app.zip
            ${{ runner.temp }}/build.txt
          retention-days: 3

  bench:
    name: ${{ matrix.name }}
    needs: build-macos
    if: ${{ !cancelled() && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && inputs.jobs != 'smoke' && inputs.jobs != 'model' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 (Apple silicon)
            os: macos-15
            asset: macos-arm64.dmg
            modes: texture readback
            gates: --stills --gate-ui-cpu-p95 UI --gate-gpu-p95 GPU
          - name: macOS 14 (Apple silicon)
            os: macos-14
            asset: macos-arm64.dmg
            modes: texture readback
            gates: --stills --gate-ui-cpu-p95 UI --gate-gpu-p95 GPU
          - name: Windows (WARP)
            os: windows-latest
            asset: windows-x86_64.zip
            modes: readback
            gates: ''
          - name: Linux (Xvfb, lavapipe)
            os: ubuntu-24.04
            asset: linux-x86_64.tar.gz
            modes: texture readback
            gates: --stills
    env:
      GH_TOKEN: ${{ github.token }}
      FRAMES: ${{ inputs.frames || '300' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/noshape-binary
        if: runner.os != 'macOS' || inputs.ref == ''
        with:
          tag: ${{ inputs.tag }}
          ref: ${{ inputs.ref }}
          asset: ${{ matrix.asset }}

      - uses: actions/download-artifact@v8
        if: runner.os == 'macOS' && inputs.ref != ''
        with:
          name: noshape-macos-app
          path: ${{ runner.temp }}/built

      - name: The app built from source (macOS)
        if: runner.os == 'macOS' && inputs.ref != ''
        run: |
          ditto -x -k "$RUNNER_TEMP/built/noshape-app.zip" "$RUNNER_TEMP"
          echo "BIN=$RUNNER_TEMP/noshape.app/Contents/MacOS/noshape" >> "$GITHUB_ENV"
          echo "BUILD=$(cat "$RUNNER_TEMP/built/build.txt")" >> "$GITHUB_ENV"

      # ------------------------------------------------------------ the runner
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "DELAY=60" >> "$GITHUB_ENV"
          system_profiler SPDisplaysDataType | sed -n 1,40p
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb imagemagick mesa-vulkan-drivers libvulkan1 \
            libxkbcommon-x11-0 libxcb-xkb1 libx11-xcb1 libfontconfig1 python3-pil
          echo "DELAY=120" >> "$GITHUB_ENV"
          echo "FRAMES=60" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DELAY=150" >> $env:GITHUB_ENV
          "FRAMES=60" >> $env:GITHUB_ENV
          python -m pip install --quiet pillow

      # --------------------------------------------------------------- the runs
      - name: Benchmarks
        if: runner.os != 'Windows'
        env:
          VARIANTS: ${{ inputs.variants || '' }}
          BENCH_ENV: ${{ inputs.env || '' }}
          COLD: ${{ inputs.cold || '' }}
        run: .github/perf/bench.sh "$BIN" "$FIXTURE" "$RUNNER_TEMP/perf" ${{ inputs.modes || matrix.modes }}

      - name: Benchmarks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/perf/bench.ps1 $env:BIN $env:FIXTURE "$env:RUNNER_TEMP\perf" ${{ inputs.modes || matrix.modes }}

      - name: Baseline (last successful run on main)
        if: inputs.fixture == ''
        continue-on-error: true
        shell: bash
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow perf.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ -n "$id" && "$id" != "${{ github.run_id }}" ]]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "perf-${{ matrix.os }}" --dir "$RUNNER_TEMP/baseline" && echo "baseline: run $id"
          else
            echo "no baseline yet"
          fi

      - name: Summary and gates
        id: analyze
        shell: bash
        run: |
          gates="${{ matrix.gates }}"
          gates="${gates//UI/$UI_CPU_P95_MS}"; gates="${gates//GPU/$GPU_P95_MS}"
          set +e
          python3 .github/perf/analyze.py "$RUNNER_TEMP/perf" "${{ matrix.name }} ($BUILD)" $gates \
            --baseline "$RUNNER_TEMP/baseline" --max-regression "$MAX_REGRESSION"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: ${{ runner.temp }}/perf
          if-no-files-found: warn

      - name: Gates
        if: steps.analyze.outputs.status != '0'
        run: exit 1

  # Regeneration performance (jobs: model only): qa5's 400-hole plate
  # (crates/model/tests/big_plate.rs, PERF1: holes, a 400-edge chamfer and a
  # depth edit, each under 2 s like Onshape's ~1 s), skb's drag-step speed
  # and the timed checks in a release build of `ref` on each OS; the times go
  # to the run summary, the logs to the model-perf-<OS> artifacts.
  model:
    name: Model perf ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && inputs.jobs == 'model'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest }
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Windows x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libfontconfig-dev libfreetype-dev libzstd-dev libx11-dev

      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: OpenCascade
        uses: ./.github/actions/setup-occt

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: model-perf-occt-V8_0_1

      - name: Big plate (release)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NOSHAPE_PERF: '1'
        run: |
          status=0
          cargo test --release --locked -p noshape-model --test big_plate -- --ignored --nocapture --test-threads=1 2>&1 | tee big_plate.log || status=$?
          { echo "### ${{ matrix.name }}"; grep -E "big plate:|tessellate Part 1|boolean_into Cut" big_plate.log || true; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # PowerShell: Git Bash's /usr/bin/link would shadow MSVC's link.exe.
      - name: Big plate (release, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NOSHAPE_PERF: '1'
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --release --locked -p noshape-model --test big_plate -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath big_plate.log
          $status = $LASTEXITCODE
          "### ${{ matrix.name }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path big_plate.log -Pattern 'big plate:|tessellate Part 1|boolean_into Cut' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $status

      # skb's drag-step speed (crates/model/tests/drag_speed.rs): one drag
      # solve of a 19-cube Planar stack against live's ~21 ms per step.
      - name: Drag speed (release)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          status=0
          cargo test --release --locked -p noshape-model --test drag_speed -- --ignored --nocapture --test-threads=1 2>&1 | tee drag_speed.log || status=$?
          { echo "### ${{ matrix.name }}: drag speed"; grep -E "per drag step|panicked" drag_speed.log || true; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Drag speed (release, Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --release --locked -p noshape-model --test drag_speed -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath drag_speed.log
          $status = $LASTEXITCODE
          "### ${{ matrix.name }}: drag speed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path drag_speed.log -Pattern 'per drag step|panicked' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $status

      # Wall-clock checks of the ci.yml tests (their `timed_` twins, ignored
      # there: ci.yml tests are deterministic): patterns linear in their
      # instance count, an abort stopping a 1000-instance pattern, a
      # million-instance pattern failing at once, a 1 MB commit.
      - name: Timed checks (release)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          status=0
          cargo test --release --locked -p noshape-model --test pattern_perf --test pattern_fins --test engine --test qa_regressions -- --ignored --nocapture --test-threads=1 timed_ 2>&1 | tee timed.log || status=$?
          cargo test --release --locked -p noshape-store --lib -- --ignored --nocapture timed_ 2>&1 | tee -a timed.log || status=$?
          { echo "### ${{ matrix.name }}: timed checks"; echo '```'; grep -E "^test timed_|×[0-9]+|1 MB commit|after the abort|panicked" timed.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Timed checks (release, Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --release --locked -p noshape-model --test pattern_perf --test pattern_fins --test engine --test qa_regressions -- --ignored --nocapture --test-threads=1 timed_ 2>&1 | Tee-Object -FilePath timed.log
          $status = $LASTEXITCODE
          cargo test --release --locked -p noshape-store --lib -- --ignored --nocapture timed_ 2>&1 | Tee-Object -FilePath timed_store.log
          if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          "### ${{ matrix.name }}: timed checks" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path timed.log, timed_store.log -Pattern '^test timed_|×[0-9]+|1 MB commit|after the abort|panicked' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $status

      # User bug 10-24 (crates/model/tests/pattern_second.rs): ×400 fins on top
      # (LP1) and the same pattern under the plate (LP2), with and without
      # Reapply; LP2 must cost about LP1, and an abort must return at once.
      - name: Second pattern (release)
        # Timed on its own: a slow step before it doesn't hide its numbers.
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        env:
          NOSHAPE_PATTERN_N: '400'
          NOSHAPE_PERF: '1'
          RUST_LOG: 'perf=info'
        run: |
          status=0
          cargo test --release --locked -p noshape-model --test pattern_second -- --include-ignored --nocapture --test-threads=1 2>&1 | tee pattern_second.log || status=$?
          { echo "### ${{ matrix.name }}: second pattern"; echo '```'; grep -E "×[0-9]+|panicked|assert" pattern_second.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Second pattern (release, Windows)
        # Timed on its own: a slow step before it doesn't hide its numbers.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          NOSHAPE_PATTERN_N: '400'
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --release --locked -p noshape-model --test pattern_second -- --include-ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath pattern_second.log
          $status = $LASTEXITCODE
          "### ${{ matrix.name }}: second pattern" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path pattern_second.log -Pattern '×[0-9]+|panicked|assert' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $status

      # Regeneration profile (crates/ops/tests/regen_profile.rs): every feature
      # of the tests/perf fixtures and of the std sheet-metal route, top 15.
      - name: Regeneration profile (release)
        # Timed on its own: a slow step before it doesn't hide its numbers.
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          status=0
          cargo test --release --locked -p noshape-ops --test regen_profile -- --ignored --nocapture --test-threads=1 2>&1 | tee regen_profile.log || status=$?
          { echo "### ${{ matrix.name }}: regeneration profile"; echo '```'; grep -E "^profile:" regen_profile.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Regeneration profile (release, Windows)
        # Timed on its own: a slow step before it doesn't hide its numbers.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --release --locked -p noshape-ops --test regen_profile -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath regen_profile.log
          $status = $LASTEXITCODE
          "### ${{ matrix.name }}: regeneration profile" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Select-String -Path regen_profile.log -Pattern '^profile:' | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $status

      - name: Upload timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: model-perf-${{ runner.os }}
          path: '*.log'
          if-no-files-found: ignore
