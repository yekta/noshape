[package]
name = "noshape-sketch"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
glam.workspace = true
nalgebra.workspace = true
serde.workspace = true
thiserror.workspace = true
smallvec.workspace = true
indexmap.workspace = true
log.workspace = true
ttf-parser = "0.25"
zstd.workspace = true
cadkit-core = "=0.3.3"
cadkit-dwg = "=0.3.3"
cadkit-dxf = "=0.3.3"
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

# Integration tests (tools/tiers/merge-tests.py): tests/all.rs holds every file but the standalone ones.
[[test]]
name = "all"
path = "tests/all.rs"
