[package]
name = "noshape-assembly-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "noshape's Assembly studio UI: the assembly editor, its panels, dialogs and tools. Built on noshape-app-core (and noshape-drawing-ui for Create drawing); the noshape binary registers what it needs of the app (assembly_hooks)."

[dependencies]
noshape-app-core.workspace = true
noshape-drawing-ui.workspace = true
noshape-render.workspace = true
noshape-model.workspace = true
noshape-store.workspace = true
noshape-units.workspace = true
noshape-sketch.workspace = true
noshape-ops.workspace = true
noshape-scene.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
glam.workspace = true
log.workspace = true
parking_lot.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
serde_json.workspace = true
serde.workspace = true
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# UI tests on GPUI's test platform (docs/TESTS.md "UI keystroke tests"), as part-studio-ui's.
noshape-ui-test-support = { path = "../ui-test-support" }
gpui = { package = "gpui-pre", version = "=0.3.9" }
