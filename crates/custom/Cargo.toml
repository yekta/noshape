[package]
name = "noshape-custom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "noshape's FeatureScript host: compiling Feature Studios, custom features and tables, the modeling natives, the features std runs. Above noshape-model-core; the data types are in noshape-model-data."

[dependencies]
noshape-units.workspace = true
noshape-sketch.workspace = true
noshape-kernel.workspace = true
noshape-featurescript.workspace = true
noshape-model-data.workspace = true
noshape-model-core.workspace = true
serde_json.workspace = true
glam.workspace = true
log.workspace = true
parking_lot.workspace = true
# zlib of packed queries (qCompressed, @unpackQuery).
miniz_oxide = "0.8"
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }
