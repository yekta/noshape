[package]
name = "noshape-update"
description = "In-app updates: the release feed, Sigstore-verified downloads, the per-platform swap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
semver = "1"
sha2 = "0.10"
base64 = "0.23"
ring = "0.17"
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }
