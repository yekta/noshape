[package]
name = "noshape-release-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "noshape's release management UI: the release and obsoletion dialogs, the release workflow, revision history and tools, and Company settings (numbering schemes, release management, revision tools). Built on noshape-app-core and noshape-preferences-ui; the noshape binary registers what it needs of the app (release_hooks)."

[dependencies]
noshape-app-core.workspace = true
noshape-preferences-ui.workspace = true
noshape-model.workspace = true
noshape-store.workspace = true
noshape-units.workspace = true
noshape-ops.workspace = true
noshape-scene.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
# Local times in the release dialogs and revision history.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Release ⋯ › View workflow: the diagram SVG with the app's Roboto (gpui's
# SVG renderer only knows system fonts). Same version gpui uses.
resvg = { version = "0.46", default-features = false, features = ["text"] }
serde_json.workspace = true
serde.workspace = true
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }
