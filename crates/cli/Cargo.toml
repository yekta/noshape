[package]
name = "noshape-cli"
description = "noshape's command line and MCP server for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[[bin]]
name = "noshape-cli"
path = "src/main.rs"

[dependencies]
noshape-ops.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["string"] }
base64 = "0.22"
dirs = "6"
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(windows)'.dependencies]
# The global allocator on Windows (WINDOWS-RUST-SLOW: the system heap is slow for many small allocations).
mimalloc = { version = "0.1", default-features = false }

# Integration tests (tools/tiers/merge-tests.py): tests/all.rs holds every file but the standalone ones.
[[test]]
name = "all"
path = "tests/all.rs"
