[package]
name = "noshape-feature-studio-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "noshape's Feature Studio UI: the FeatureScript editor, its notices, search, import panel, profiler and std's source. Built on noshape-app-core and noshape-preferences-ui (the Labs switches); the noshape binary registers what it needs of the app (feature_studio_hooks)."

[dependencies]
noshape-app-core.workspace = true
noshape-preferences-ui.workspace = true
noshape-model.workspace = true
noshape-store.workspace = true
noshape-ops.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
regex = "1"
serde_json.workspace = true
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# UI keystroke tests on GPUI's test platform (docs/TESTS.md "UI keystroke tests"): the features come through
# noshape-ui-test-support, never in normal builds; `gpui` by name for `#[gpui::test]`.
noshape-ui-test-support = { path = "../ui-test-support" }
gpui = { package = "gpui-pre", version = "=0.3.9" }
