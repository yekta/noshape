[package]
name = "noshape-scene"
description = "GUI-free viewport logic: scene building, sketch editing tools, palette, offscreen PNG rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
noshape-model.workspace = true
noshape-render.workspace = true
noshape-sketch.workspace = true
noshape-units.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }

# Integration tests (tools/tiers/merge-tests.py): tests/all.rs holds every file but the standalone ones.
[[test]]
name = "all"
path = "tests/all.rs"
