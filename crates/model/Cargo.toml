autotests = false

[dependencies]
noshape-units.workspace = true
noshape-sketch.workspace = true
noshape-kernel.workspace = true
noshape-featurescript.workspace = true
noshape-model-data.workspace = true
earcutr = "0.5"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true
glam.workspace = true
uuid.workspace = true
log.workspace = true
rayon.workspace = true
ahash.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
