[package]
name = "noshape"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, fully local, parametric CAD application."

[[bin]]
name = "noshape"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
noshape-render.workspace = true
noshape-model.workspace = true
noshape-store.workspace = true
noshape-units.workspace = true
noshape-sketch.workspace = true
noshape-kernel.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true
parking_lot.workspace = true
ahash.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
async-channel = "2"
rust-embed = "8"
rfd = "0.15"
dirs = "6"
serde_json.workspace = true
serde.workspace = true
rusqlite.workspace = true
trash = "5"
open = "5"
