[package]
name = "noshape"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, fully local, parametric CAD application."
autotests = false

[[bin]]
name = "noshape"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
noshape-app-core.workspace = true
noshape-drawing-ui.workspace = true
noshape-assembly-ui.workspace = true
noshape-part-studio-ui.workspace = true
noshape-variable-studio-ui.workspace = true
noshape-preferences-ui.workspace = true
noshape-release-ui.workspace = true
noshape-feature-studio-ui.workspace = true
noshape-history-ui.workspace = true
noshape-start-ui.workspace = true
noshape-render.workspace = true
noshape-model.workspace = true
noshape-store.workspace = true
noshape-units.workspace = true
noshape-sketch.workspace = true
noshape-kernel.workspace = true
noshape-ops.workspace = true
noshape-cli.workspace = true
noshape-scene.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true
parking_lot.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
async-channel = "2"
rfd = "0.15"
serde_json.workspace = true
open = "5"
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(windows)'.dependencies]
gpui-pre-windows = "0.3.9"

# Integration tests (tools/tiers/merge-tests.py): tests/all.rs holds every file but the standalone ones.
[[test]]
name = "all"
path = "tests/all.rs"
