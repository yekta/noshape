[package]
name = "noshape"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, fully local, parametric CAD application."

[[bin]]
name = "noshape"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
noshape-render.workspace = true
noshape-model.workspace = true
noshape-store.workspace = true
noshape-units.workspace = true
noshape-sketch.workspace = true
noshape-kernel.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true
parking_lot.workspace = true
ahash.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
async-channel = "2"
rust-embed = "8"
rfd = "0.15"
dirs = "6"
# Local times in the documents page and the versions panel ("1:15 PM Today").
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
tiny-skia = "0.11"
# Release ⋯ › View workflow: the diagram SVG with the app's Roboto (gpui's
# SVG renderer only knows system fonts). Same version gpui uses.
resvg = { version = "0.46", default-features = false, features = ["text"] }
serde_json.workspace = true
serde.workspace = true
rusqlite.workspace = true
open = "5"
# The selection-count cursor sets an image cursor through the platform (cursor.rs).
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = { version = "0.13", features = ["render", "cursor", "resource_manager"] }
# For its Wayland image-cursor hook (vendored and patched, see the workspace Cargo.toml).
gpui-pre-linux = { version = "=0.3.9", default-features = false }
# Its GPU context, shared with the 3D viewport renderer (gpu.rs; vendored and patched).
gpui-pre-wgpu = { version = "=0.3.9", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = "0.3.9"
objc2 = "0.6"
# The viewport's Metal textures, handed to gpui's renderer (gpu.rs).
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLResource", "MTLTexture"] }
objc2-app-kit = { version = "0.3", features = ["NSCursor", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }

[target.'cfg(windows)'.dependencies]
gpui-pre-windows = "0.3.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
