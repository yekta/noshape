noshape-featurescript.workspace = true
noshape-model-data.workspace = true
noshape-model-core.workspace = true
noshape-custom.workspace = true
noshape-assembly.workspace = true
earcutr = "0.5"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true
glam.workspace = true
uuid.workspace = true
log.workspace = true
rayon.workspace = true
ahash.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
nalgebra.workspace = true
# DWG / DWT and DXF 2000+ drawing export (MPL-2.0).
acadrust = "0.6.5"
