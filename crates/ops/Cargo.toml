[package]
name = "noshape-ops"
description = "Headless operations layer shared by the noshape UI, CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
noshape-units.workspace = true
noshape-sketch.workspace = true
noshape-kernel.workspace = true
noshape-model.workspace = true
noshape-store.workspace = true
noshape-render.workspace = true
noshape-scene.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
log.workspace = true
parking_lot.workspace = true
miniz_oxide = "0.8"
# Drawing export to PNG / JPEG / TIFF with live's file details (4:2:0
# JPEG, pHYs, one-strip TIFF).
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
png = "0.18"
tiff = "0.11"
resvg = { version = "0.46", default-features = false }
noshape-workspace-hack = { version = "0.1", path = "../workspace-hack" }

# Integration tests (tools/tiers/merge-tests.py): tests/all.rs holds every file but the standalone ones.
[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "prefs"
path = "tests/prefs.rs"
