[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored, patched dependencies (see [patch.crates-io]); not workspace members.
exclude = ["vendor"]
default-members = ["crates/app"]

[workspace.package]
version = "0.4.14"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yekta/noshape"
rust-version = "1.90"

[workspace.dependencies]
noshape-units = { path = "crates/units" }
noshape-brep = { path = "crates/brep" }
noshape-sketch = { path = "crates/sketch" }
noshape-kernel = { path = "crates/kernel" }
noshape-model = { path = "crates/model" }
noshape-model-data = { path = "crates/model-data" }
noshape-model-core = { path = "crates/model-core" }
noshape-custom = { path = "crates/custom" }
noshape-assembly = { path = "crates/assembly" }
noshape-drawing = { path = "crates/drawing" }
noshape-store = { path = "crates/store" }
noshape-render = { path = "crates/render" }
noshape-featurescript = { path = "crates/featurescript" }
noshape-ops = { path = "crates/ops" }
noshape-scene = { path = "crates/scene" }
noshape-app-core = { path = "crates/app-core" }
noshape-drawing-ui = { path = "crates/drawing-ui" }
noshape-assembly-ui = { path = "crates/assembly-ui" }
noshape-part-studio-ui = { path = "crates/part-studio-ui" }
noshape-variable-studio-ui = { path = "crates/variable-studio-ui" }
noshape-preferences-ui = { path = "crates/preferences-ui" }
noshape-release-ui = { path = "crates/release-ui" }
noshape-feature-studio-ui = { path = "crates/feature-studio-ui" }
noshape-history-ui = { path = "crates/history-ui" }
noshape-start-ui = { path = "crates/start-ui" }

gpui-kit = "0.7.3"
wgpu = "29"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
# float_roundtrip: documents reload (open, undo) with the exact same floats.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
rayon = "1"
smallvec = { version = "1", features = ["serde", "union"] }
nalgebra = "0.35"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
zstd = "0.14"
blake3 = "1"
log = "0.4"
env_logger = "0.11"
pollster = "1"
cxx = "1"
cxx-build = "1"
indexmap = { version = "2", features = ["serde"] }
ahash = "0.8"

[profile.dev]
opt-level = 1
# Line tables keep backtraces useful at a fraction of the disk space.
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false
# The app crate (138k lines of UI code; the GPU does the heavy work) unoptimised in dev builds: its codegen is the
# slowest step of every rebuild. Geometry crates stay at opt-level 1 so tests and the dev app stay fast.
[profile.dev.package.noshape]
opt-level = 0
# The Drawing studio UI, split out of the app (docs/CRATES.md): unoptimised like the app.
[profile.dev.package.noshape-drawing-ui]
opt-level = 0
# The Assembly studio UI, likewise.
[profile.dev.package.noshape-assembly-ui]
opt-level = 0
# The Part Studio UI, likewise.
[profile.dev.package.noshape-part-studio-ui]
opt-level = 0
# The Variable Studio UI, likewise.
[profile.dev.package.noshape-variable-studio-ui]
opt-level = 0
[profile.dev.package.noshape-preferences-ui]
opt-level = 0
[profile.dev.package.noshape-release-ui]
opt-level = 0
[profile.dev.package.noshape-feature-studio-ui]
opt-level = 0
[profile.dev.package.noshape-history-ui]
opt-level = 0
[profile.dev.package.noshape-start-ui]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# NOSHAPE PATCH: gpui's Linux platform with application image cursors on
# Wayland (Onshape's selection-count cursor). Only the files marked
# "NOSHAPE PATCH" differ from the published 0.3.9; see
# vendor/gpui-pre-linux/src/custom_cursor.rs.
[patch.crates-io]
# NOSHAPE PATCH (agent nav2): wheel events carry Chromium's wheel ticks
# (`ScrollWheelEvent::wheel_ticks`): X11 valuator increments
# (src/linux/x11/client.rs `make_scroll_wheel_event`), Wayland value120 or
# axis values summed per frame as Chromium does (src/linux/wayland/client.rs
# `chrome_axis`).
# NOSHAPE PATCH (agent nav2): pens as Chrome reports them: X11 stylus devices
# (an "Abs Pressure" valuator) and Wayland graphics tablets (new
# src/linux/wayland/tablet.rs, zwp_tablet_v2) become touches unless
# `gpui::set_pen_as_mouse`; Wayland keeps every held mouse button.
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# NOSHAPE PATCH (agent psui): Metal libraries compiled ahead of time. Before
# compiling the MSL naga writes, the Metal backend loads the metallib built
# for that exact source when the app ships one (src/metal/precompiled.rs;
# packaging/macos/metallibs.sh builds them in the release job), and
# NOSHAPE_MSL_DUMP writes the sources. Only the lines marked "NOSHAPE PATCH"
# in src/metal/{mod,device}.rs and src/metal/precompiled.rs differ from 29.0.4.
wgpu-hal = { path = "vendor/wgpu-hal" }
# NOSHAPE PATCH (agent nav): gpui's macOS platform exposes whether a right
# press was a converted Ctrl+left click (`last_right_press_was_ctrl_click`),
# so the viewport can treat it as Chrome on macOS does. Only the lines marked
# "NOSHAPE PATCH" in src/window.rs and src/gpui_macos.rs differ from 0.3.9.
# NOSHAPE PATCH (agent nav2): wheel ticks from the CGEvent's DeltaAxis /
# PointDeltaAxis fields, and a cancelled magnify ends the pinch
# (src/events.rs `wheel_ticks`).
# NOSHAPE PATCH (agent nav2): tablet-point (pen) mouse events become touches
# unless `gpui::set_pen_as_mouse` (src/events.rs `pen_touch`).
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# NOSHAPE PATCH (agent nav): gpui core routes raw multi-touch to elements:
# `TouchEvent` is a mouse event for `Window::on_mouse_event`, and a listener
# that calls `prevent_default` on a touch's Started event claims the touch
# from the portable recognizer (src/window.rs `dispatch_touch_event`,
# src/interactive.rs). Examples and tests of the published crate are left out.
# NOSHAPE PATCH (agent perf): application textures composited without a
# copy (new src/external_texture.rs; `Window::paint_external_texture` and
# `Window::request_present` in src/window.rs, used by the 3D viewport), and
# reports draw phase timings to the app's NOSHAPE_PERF (new src/draw_stats.rs,
# hooks in `Window::draw_roots` / `present`).
# NOSHAPE PATCH (agent qa4): shaped text lines are kept across frames
# (`RecentLines` in src/text_system/line_layout.rs), so text drawn again after
# a frame without it (a list row shown again after filtering) isn't reshaped.
# NOSHAPE PATCH (agent nav2): `ScrollWheelEvent::wheel_ticks`, the wheel
# notches as a browser counts them (src/interactive.rs).
# NOSHAPE PATCH (agent nav2): `set_pen_as_mouse` / `pen_as_mouse`, shared by
# the platform layers (src/interactive.rs).
gpui-pre = { path = "vendor/gpui-pre" }
# NOSHAPE PATCH (agent nav): gpui's Windows platform turns touch-screen (and
# pen) pointer messages into raw touches instead of emulated mouse input
# (src/events.rs `handle_pointer_msg`, src/gpui_windows.rs `set_pen_as_mouse`).
# NOSHAPE PATCH (agent nav2): wheel ticks from WHEEL_DELTA (src/events.rs),
# and the precision touchpad works in whole pixels like Chromium's
# DirectManipulation handler (src/direct_manipulation.rs).
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# NOSHAPE PATCH (agent ui): gpui-base's text input paints a plain input's
# selection like the browser (Chrome `#3367d1`, white selected text) when the
# app sets `input::PlainSelectionColors`; code editors keep the theme color.
# NOSHAPE PATCH (agent ui2): code editors take their gutter metrics (minimum
# digits, number inset, margin, fold column) from `input::CodeGutterMetrics`
# when the app sets it (Feature Studio = Ace's 42 px gutter), and an app can
# draw its own diagnostic tooltip (`input::set_app_diagnostic_hover`,
# `hovered_diagnostic()`), gutter markers (`input::GutterMarkerRenderer`) and
# squiggle colors (`input::DiagnosticColors` as a global).
# Only the lines marked "NOSHAPE PATCH" in src/input/mod.rs,
# src/input/base/element.rs, src/input/base/state.rs and
# src/input/editor/highlighting.rs differ from 0.7.3.
# NOSHAPE PATCH (agent ui): the whole input box (padding included, or an
# app's own box marked with `input::input_frame`) takes presses and shows the
# I-beam, as in browsers (src/input/base/frame_hit.rs, src/input/base/mod.rs,
# src/input/base/state.rs).
gpui-base = { path = "vendor/gpui-base" }
# NOSHAPE PATCH (agent ui): `Button` shows the pointer when clickable and
# `not-allowed` when disabled, like Onshape's buttons in Chrome (only the
# lines marked "NOSHAPE PATCH" in src/button/button.rs differ from 0.7.3).
# NOSHAPE PATCH (agent qa4): `Button` boxes its base control, content style and
# loading icon, so building one doesn't memmove ~7 KB at every builder call.
gpui-component = { path = "vendor/gpui-component" }
# NOSHAPE PATCH (agent perf): gpui's wgpu renderer (Linux) shares its GPU
# context with the app (`shared_context`, `wait_for_shared_context`, optional
# device features via `request_device_features`) and draws application
# textures registered with gpui-pre's `set_external_texture` (src/wgpu_atlas.rs
# `get_texture_info`; their bind groups are cached per texture view in
# src/wgpu_renderer.rs), so the 3D viewport is composited without a readback.
# Only the lines marked "NOSHAPE PATCH" in src/wgpu_context.rs,
# src/wgpu_atlas.rs and src/wgpu_renderer.rs differ from 0.3.9.
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# NOSHAPE PATCH (agent perf): gpui's Metal renderer (macOS) draws application
# textures registered with gpui-pre's `set_external_texture` (an `MTLTexture`;
# src/metal_atlas.rs `metal_texture`), reports its GPU (`note_renderer_gpu`)
# and when each frame finished on the GPU (`gpu_frame_completed`, so a
# texture is only rendered into again once no frame samples it; src/
# metal_renderer.rs), and times its draws (`note_window_draw`: wall time and
# the wait for a drawable). Only the lines marked "NOSHAPE PATCH" differ from 0.3.9.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
